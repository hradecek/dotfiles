# keyd — system-level key remapping (installed to /etc/keyd/default.conf by
# bootstrap/linux-system.sh; not chezmoi-managed since it lives in /etc).
#
# Purpose: let a *lone tap* of the Super/Win key launch fuzzel, while holding
# Super still works as a modifier. The emitted F13 keycode is resolved by xkb's
# inet(evdev) symbols to the keysym XF86Tools, so River binds *XF86Tools* (not
# F13) to `spawn fuzzel` (see home/dot_config/river/executable_init). This
# mirrors the Windows setup where the WM modifier is Alt and tapping Win opens
# the launcher (Start).
#
# overload(meta, f13): hold leftmeta -> the built-in `meta` (Super) modifier
# layer (so Super+Alt floating binds etc. still work); tap leftmeta -> F13.
[ids]
*

[main]
leftmeta = overload(meta, f13)
