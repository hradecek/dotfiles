# Package manifest — source of truth for the system packages this dotfiles
# repo depends on. Consumed by run_onchange_install-packages.sh.tmpl, which
# installs anything missing on `chezmoi apply` (Linux only, idempotent).
#
# Keep this list in sync with what the configs actually reference. Edit a list
# here and the next `chezmoi apply` installs the additions automatically.
#
# Prerequisites NOT installed from here (chicken-and-egg — needed first):
#   - chezmoi   the bootstrapper itself (installed to ~/.local/bin)
# yay (AUR helper for the `aur` list) is bootstrapped by run_once_before_install-yay.sh.

packages:
  # Installed with: pacman -S --needed
  pacman:
    # --- Wayland desktop (River session) ---
    # river-classic is the 0.3.x line; river 0.4 dropped riverctl/rivertile,
    # which the init script and tag-watch need.
    - river-classic               # Wayland compositor (riverctl, rivertile)
    - waybar                      # status bar
    - fuzzel                      # application launcher (Super tap, via keyd)
    - mako                        # notification daemon (makoctl)
    - swaylock                    # screen locker (Super+L)
    - swaybg                      # wallpaper
    - wlr-randr                   # output/scaling config in river/init
    - grim                        # screenshots
    - slurp                       # region selection for grim
    - flameshot                   # screenshot GUI (Print key)
    - jq                          # parses ristate JSON in river/tag-watch.sh
    # --- Audio / media / hardware keys ---
    - alsa-utils                  # amixer, alsamixer (volume keys)
    - wireplumber                 # wpctl (PipeWire session manager)
    - playerctl                   # media play/pause/next keys
    - btop                        # system monitor (config follows the terminal theme)
    - brightnessctl               # brightness keys
    # --- Network ---
    - nm-connection-editor        # waybar network on-click
    # --- Bluetooth ---
    - bluez                       # bluetoothd (waybar bluetooth module reads it over D-Bus)
    - bluez-utils                 # bluetoothctl
    - blueman                     # blueman-manager (waybar bluetooth on-click)
    # --- Fonts (UI + waybar glyphs) ---
    - ttf-mononoki-nerd           # primary UI/terminal font
    - ttf-nerd-fonts-symbols-mono # icon glyph fallback
    - ttf-iosevka-nerd            # paper theme font
    # --- Shell / SSH keyring ---
    - zsh                         # login shell
    - zsh-autosuggestions         # sourced from /usr/share/zsh/plugins in .zshrc
    - zsh-syntax-highlighting     # sourced from /usr/share/zsh/plugins in .zshrc
    - zsh-completions             # extra completions (default fpath)
    - fzf                         # fuzzy finder (Ctrl+R/Ctrl+T/Alt+C in .zshrc)
    - fd                          # file lister for fzf Ctrl+T/Alt+C
    - bat                         # fzf Ctrl+T preview
    - zoxide                      # `z` directory jumping
    - ripgrep                     # rg (LazyVim grep)
    - starship                    # cross-shell prompt (Windows: winget Starship.Starship)
    - keyd                        # lone Super-tap -> F13 launcher (see keyd/, bootstrap)
    - git                         # VCS
    - neovim                      # editor (LazyVim)
    - libsecret                   # secret-tool (ssh askpass helper)
    - gnome-keyring               # auto-unlocked login keyring
    - gcr-4                       # gcr-ssh-agent (SSH_AUTH_SOCK)
    # --- Dev toolchain ---
    - maven                       # mvn aliases
    - jdk21-openjdk               # JAVA_HOME=/usr/lib/jvm/default
    # --- System ---
    - ly                          # TUI display manager (also see bootstrap/)

  # Installed with: yay -S --needed   (requires yay; see prerequisites above)
  aur:
    - waybar-updates              # pacman update count module for waybar
    - ristate                     # river-status reader for prev/next tag cycling
    - otf-departure-mono          # pixel font of the retro theme (icons fall back to the Nerd symbols font)

  # Nerd Fonts installed on WINDOWS by run_onchange_install-fonts.ps1 (per-user,
  # no admin). Each name is a nerd-fonts release archive basename, downloaded
  # from github.com/ryanoasis/nerd-fonts/releases/latest/download/<name>.zip.
  # The Linux equivalents come from the pacman list above (ttf-mononoki-nerd).
  nerdfonts:
    - Mononoki                    # primary UI/terminal font (Alacritty font.family)

  # PowerShell modules installed on WINDOWS by run_onchange_install-psmodules.ps1
  # (into PowerShell 7, the shell Alacritty launches). Imported by the profile.
  psmodules:
    - Terminal-Icons              # file-type icons + colors in listings (~ LS_COLORS)
