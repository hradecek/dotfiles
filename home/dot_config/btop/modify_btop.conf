#!/bin/sh
# chezmoi modify script: btop rewrites btop.conf on exit, so only these keys are
# managed. btop uses the terminal's palette and background, which follow the
# active desktop theme.
awk '
/^color_theme = /      { print "color_theme = \"TTY\"";   seen_theme = 1; next }
/^theme_background = / { print "theme_background = False"; seen_bg = 1; next }
{ print }
END {
    if (!seen_theme) print "color_theme = \"TTY\""
    if (!seen_bg)    print "theme_background = False"
}'
