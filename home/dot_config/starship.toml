# Starship prompt — single source of truth shared across Linux (zsh) and
# Windows (pwsh). Read from ~/.config/starship.toml on both (XDG layout).
# Reproduces the previous Spaceship setup: time, directory, git, java (☕),
# command duration hidden, prompt character on its own line.

add_newline = true

format = """
$time$directory$git_branch$git_status$java
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style) "
style = "bold yellow"

[directory]
truncate_to_repo = false
truncation_length = 5
style = "bold cyan"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "bold purple"

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[java]
symbol = "☕ "
format = "[${symbol}(${version} )]($style)"
style = "bold red"

# Spaceship had SPACESHIP_EXEC_TIME_SHOW=false.
[cmd_duration]
disabled = true
