name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: shellcheck plain scripts
        run: |
          shellcheck -S warning -s sh bootstrap/*.sh shell/ssh/*.sh shell/aliases/*.sh \
            home/run_once_before_*.sh \
            home/dot_config/river/executable_* home/dot_config/waybar/executable_* \
            home/dot_config/themes/*/river.sh home/dot_local/bin/executable_* \
            home/dot_config/btop/modify_*
      - name: shellcheck rendered script templates
        run: |
          for t in home/run_onchange_*.sh.tmpl; do
            echo "== $t"
            chezmoi execute-template --source . < "$t" | shellcheck -S warning -s sh -
          done

  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi (Linux)
        if: runner.os == 'Linux'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b 'C:\chezmoi'"
          C:\chezmoi\chezmoi.exe --version
          "C:\chezmoi" >> $env:GITHUB_PATH
      - name: Render every template and diff against an empty home
        shell: bash
        run: |
          dest="$RUNNER_TEMP/home"
          mkdir -p "$dest"
          chezmoi apply --dry-run --verbose --source . --destination "$dest"
